<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Album</title>
<style>
:root{--space1:#120a2e; --space2:#2a1a5e; --glow:#ffd86b; --ink:#f6f2ff; --muted:#c9bfe8}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% 0%, var(--space2), var(--space1) 70%) fixed;
  padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
}
header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px}
h1{margin:0; font-size:1.6rem}
p.sub{margin:0 0 16px; color:var(--muted); font-size:.95rem}
.btn{
  padding:10px 18px; font-size:.95rem; font-weight:700; cursor:pointer; border:0; border-radius:999px;
  background:var(--glow); color:#2b1d00; text-decoration:none; display:inline-block;
}
.btn.ghost{background:rgba(255,255,255,.14); color:var(--ink); border:1px solid rgba(255,255,255,.35)}
.btn:focus-visible,.tile:focus-visible{outline:3px solid #fff; outline-offset:3px}
.bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px}
.tile{
  position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; cursor:pointer;
  border:1px solid rgba(255,255,255,.3); background:#1b1240; padding:0;
}
.tile img,.tile video{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none}
.tile .play{
  position:absolute; right:6px; bottom:6px; width:28px; height:28px; border-radius:50%;
  background:rgba(0,0,0,.6); display:grid; place-items:center; font-size:.8rem; color:#fff;
}
.empty{text-align:center; color:var(--muted); padding:40px 10px; display:none}


#viewer{
  position:fixed; inset:0; background:rgba(5,3,18,.94); display:none;
  align-items:center; justify-content:center; z-index:10;
  padding:calc(56px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px));
}
#viewer.open{display:flex}
#stage{max-width:100%; max-height:100%; display:flex}
#stage img,#stage video{max-width:100%; max-height:100%; border-radius:10px}
.ctl{
  position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); width:42px; height:42px; border-radius:50%;
  border:0; background:rgba(255,255,255,.18); color:#fff; font-size:1.3rem; cursor:pointer; z-index:11;
}
#close{right:12px} #prev{left:12px} #next{left:62px}
.count{position:fixed; top:calc(20px + env(safe-area-inset-top,0px)); right:66px; color:var(--muted); z-index:11; font-size:.9rem}
</style>
</head>
<body>

<header>
  <h1>My HSR Album</h1>
  <a class="btn ghost" href="login-final.html">Log out</a>
</header>
<p class="sub">Tap a picture or video to open it.</p>

<div class="bar">
  <button class="btn" id="addBtn" type="button">Add pictures and videos</button>
  <input id="picker" type="file" accept="image/*,video/*" multiple hidden>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty">Nothing here yet. Tap "Add pictures and videos".</div>

<div id="viewer" role="dialog" aria-label="Viewer">
  <button class="ctl" id="prev" type="button" aria-label="Previous">&#8249;</button>
  <button class="ctl" id="next" type="button" aria-label="Next">&#8250;</button>
  <span class="count" id="count"></span>
  <button class="ctl" id="close" type="button" aria-label="Close">&#10005;</button>
  <div id="stage"></div>
</div>

<script>

var ITEMS = [
  { type: "video", src: "firefly.mp4" },
  { type: "video", src: "phai.mp4" },
  { type: "image", src: "photo2.jpg"},
  { type: "video", src: "video2.mp4" },
  { type: "video", src: "cyrene.mp4" },
  { type: "video", src: "ever.mp4" },
  { type: "video", src: "caelus.mp4" },
  { type: "video", src: "night.mp4" },
   
];


var grid = document.getElementById("grid");
var empty = document.getElementById("empty");
var viewer = document.getElementById("viewer");
var stage = document.getElementById("stage");
var current = 0;

function visibleItems() { return ITEMS.filter(function (i) { return !i.broken; }); }

function render() {
  grid.innerHTML = "";
  var list = visibleItems();
  list.forEach(function (item, idx) {
    var tile = document.createElement("button");
    tile.type = "button"; tile.className = "tile";
    tile.setAttribute("aria-label", "Open " + item.type + " " + (idx + 1));
    var media;
    if (item.type === "video") {
      media = document.createElement("video");
      media.muted = true; media.preload = "metadata"; media.playsInline = true;
      media.src = item.src + "#t=0.5";
      var p = document.createElement("span"); p.className = "play"; p.textContent = "\u25B6";
      tile.appendChild(media); tile.appendChild(p);
    } else {
      media = document.createElement("img");
      media.src = item.src; media.alt = "";
      tile.appendChild(media);
    }
    media.addEventListener("error", function () { item.broken = true; render(); });
    tile.addEventListener("click", function () { openViewer(idx); });
    grid.appendChild(tile);
  });
  empty.style.display = list.length ? "none" : "block";
}

function openViewer(idx) {
  var list = visibleItems();
  if (!list.length) return;
  current = (idx + list.length) % list.length;
  var item = list[current];
  stage.innerHTML = "";
  var el;
  if (item.type === "video") {
    el = document.createElement("video");
    el.src = item.src; el.controls = true; el.autoplay = true; el.playsInline = true;
  } else {
    el = document.createElement("img"); el.src = item.src; el.alt = "";
  }
  stage.appendChild(el);
  document.getElementById("count").textContent = (current + 1) + " / " + list.length;
  viewer.classList.add("open");
}

function closeViewer() { viewer.classList.remove("open"); stage.innerHTML = ""; }

document.getElementById("close").onclick = closeViewer;
document.getElementById("prev").onclick = function () { openViewer(current - 1); };
document.getElementById("next").onclick = function () { openViewer(current + 1); };
viewer.addEventListener("click", function (e) { if (e.target === viewer) closeViewer(); });
document.addEventListener("keydown", function (e) {
  if (!viewer.classList.contains("open")) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowLeft") openViewer(current - 1);
  if (e.key === "ArrowRight") openViewer(current + 1);
});


document.getElementById("addBtn").onclick = function () { document.getElementById("picker").click(); };
document.getElementById("picker").onchange = function (e) {
  Array.prototype.forEach.call(e.target.files, function (f) {
    ITEMS.push({ type: f.type.indexOf("video") === 0 ? "video" : "image", src: URL.createObjectURL(f) });
  });
  e.target.value = "";
  render();
};

render();
</script>
</body>
</html>
